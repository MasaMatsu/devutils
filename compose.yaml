services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: mssql
    profiles:
      - aspdotnet
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=sqlserver2025@1
      - MSSQL_PID=StandardDeveloper
      - MSSQL_LCID=1041
      - MSSQL_COLLATION=Japanese_CI_AS
      - MSSQL_TCP_PORT=1433
      - MSSQL_BACKUP_DIR=/var/opt/mssql/backup
      - MSSQL_DATA_DIR=/var/opt/mssql/data
      - MSSQL_LOG_DIR=/var/opt/mssql/log
      - MSSQL_DUMP_DIR=/var/opt/mssql/dump
    volumes:
      - mssql_data:/var/opt/mssql/data
      - mssql_log:/var/opt/mssql/log
      - ./data/mssql/backup:/var/opt/mssql/backup
      - ./data/mssql/dump:/var/opt/mssql/dump
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:8-alpine
    container_name: redis
    profiles:
      - aspdotnet
    restart: unless-stopped
    volumes:
      - ./data/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    profiles:
      - aspdotnet
    restart: unless-stopped
    volumes:
      - ./data/azurite/data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mssql_data:
  mssql_log:
